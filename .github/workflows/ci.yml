name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Verify Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.120 --locked
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit Dependencies
        run: pnpm run audit:dependencies
      - name: Install Playwright Browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Rust workspace
        run: pnpm run rust:check
      - name: Verify WASM target and bindings
        run: pnpm run rust:wasm:check && pnpm --filter @ritojs/core-wasm run test
      - name: Run PR Test Pipeline
        run: pnpm run test:ci
      - name: Run Reader E2E
        run: pnpm run test:e2e
      - name: Upload Reader E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reader-e2e-results
          path: |
            apps/reader/playwright-report/
            apps/reader/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Packed Tarballs
        run: pnpm release:pack-check

  pixel-golden:
    name: Pixel Golden
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.120 --locked
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browser
        run: pnpm exec playwright install chromium
      - name: Run Pixel Golden
        run: pnpm run test:golden:pixel
        env:
          RITO_PIXEL_DIAGNOSTICS: 1
      - name: Upload Pixel Golden Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-golden-results
          path: packages/rito/test-results/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Coverage
        run: pnpm run test:coverage
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 7
