name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust-check:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Rust workspace
        run: pnpm run rust:check

  wasm:
    name: WASM Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify WASM target and bindings
        run: pnpm run rust:wasm:check && pnpm --filter @ritojs/core-wasm run build && pnpm --filter @ritojs/core-wasm run test

  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build WASM Bindings
        run: pnpm --filter @ritojs/core-wasm run build
      - name: Audit Dependencies
        run: pnpm run audit:dependencies
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Format Check
        run: pnpm run format:check

  tests:
    name: Unit & Golden Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build WASM Bindings
        run: pnpm --filter @ritojs/core-wasm run build
      - name: Install Playwright Browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Unit Tests
        run: pnpm run test:unit
      - name: Integration Tests
        run: pnpm run test:integration
      - name: Golden Books
        run: pnpm run test:golden:books
      - name: Golden Render
        run: pnpm run test:golden:render

  build-pack:
    name: Build & Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: DOM-free Reference Check
        run: pnpm --filter @ritojs/core run test:dom-free:reference
      - name: Verify Packed Tarballs
        run: pnpm release:pack-check

  reader-e2e:
    name: Reader E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Reader Packages
        run: pnpm run build
      - name: Run Reader E2E
        run: pnpm --filter @ritojs/reader exec playwright test --shard=${{ matrix.shard }}/4
        env:
          RITO_E2E_SKIP_PIXEL_SUITES: 1
      - name: Upload Reader E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reader-e2e-results-${{ matrix.shard }}
          path: |
            apps/reader/playwright-report/
            apps/reader/test-results/
          if-no-files-found: ignore
          retention-days: 7

  reader-e2e-pixel:
    name: Reader E2E (pixel suites)
    runs-on: macos-26
    # Non-blocking: these suites assert canvas-pixel heuristics that are
    # currently calibrated against the vite dev server's rendering; the
    # built preview lays the fixture out with different metrics (one line
    # fewer on the page, line boxes touching) and the pixel scans misread
    # it even though the underlying selection data assertions pass. The
    # dev-vs-build metric drift is tracked for investigation; selection
    # logic stays gated by the Linux shards. Runs on master pushes only so
    # a known-red observation job never holds a PR round hostage.
    continue-on-error: true
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browser
        run: pnpm exec playwright install chromium
      - name: Build Reader Packages
        run: pnpm run build
      - name: Run Pixel E2E Suites
        run: pnpm --filter @ritojs/reader exec playwright test tests/e2e/reader-selection.e2e.test.ts tests/e2e/reader-selection-touch.e2e.test.ts tests/e2e/reader-production-pinned-font.e2e.test.ts
      - name: Upload Pixel E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reader-e2e-pixel-results
          path: |
            apps/reader/playwright-report/
            apps/reader/test-results/
          if-no-files-found: ignore
          retention-days: 7

  pixel-golden:
    name: Pixel Golden (${{ matrix.slice }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: books-1-5
            args: --grep "book-0[1-5]-"
          - slice: books-6-10
            args: --grep-invert "book-0[1-5]-"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browser
        run: pnpm exec playwright install chromium
      - name: Build Core Package
        run: pnpm --filter @ritojs/core build && pnpm --filter @ritojs/core run build:reference
      - name: Run Pixel Golden
        run: pnpm exec playwright test -c packages/rito/playwright.config.ts ${{ matrix.args }}
        env:
          RITO_PIXEL_GOLDEN: 1
          RITO_PIXEL_DIAGNOSTICS: 1
          RITO_PIXEL_WORKERS: 3
      - name: Upload Pixel Golden Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-golden-results-${{ matrix.slice }}
          path: packages/rito/test-results/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Coverage
        run: pnpm run test:coverage
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 7
