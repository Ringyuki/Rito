# Publishes rito_flutter to pub.dev on a version tag.
#
# Trigger: push a tag `rito_flutter-vX.Y.Z` whose version matches
# pubspec.yaml. Publishing uses pub.dev's GitHub Actions automated
# publishing (OIDC) — no long-lived token is stored anywhere. One-time
# setup on pub.dev (package Admin → Automated publishing): enable
# GitHub Actions publishing for repository `Ringyuki/Rito` with tag
# pattern `rito_flutter-v{{version}}`.
#
# Safety: `dart pub publish` refuses while pubspec still carries
# `publish_to: none`, so this workflow cannot ship the package before
# the vendored-source packaging lands and that line is removed.
name: flutter-release

on:
  push:
    tags:
      - 'rito_flutter-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev OIDC exchange
      contents: read
    defaults:
      run:
        working-directory: packages/rito_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify tag matches pubspec version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#rito_flutter-v}"
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          echo "tag=$TAG_VERSION pubspec=$PUBSPEC_VERSION"
          test "$TAG_VERSION" = "$PUBSPEC_VERSION"

      # TODO(release stage 1): run the vendored-source packaging script
      # here (copy the rito-ffi crate closure + Cargo.toml/Cargo.lock/
      # rust-toolchain.toml into the package) before validation, and
      # drop `publish_to: none` from pubspec.yaml.

      - name: Validate package
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force
