name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing multiple packages is not atomic; never interrupt a release mid-flight.
  cancel-in-progress: false

jobs:
  release:
    name: Version Or Publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify cross-workflow release token
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          if [ -z "$RELEASE_GITHUB_TOKEN" ]; then
            echo "RELEASE_GITHUB_TOKEN must be a non-GITHUB_TOKEN credential that can create tags and trigger workflows."
            exit 1
          fi
      - name: Create Release PR Or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm run release:ci
          commit: 'release: version packages'
          title: 'release: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
      - name: Trigger unpublished Flutter release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          VERSION="$(awk '/^version:/ { print $2; exit }' packages/rito_flutter/pubspec.yaml)"
          TAG="rito_flutter-v${VERSION}"
          PUB_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/rito_flutter/versions/${VERSION}")"

          if [ "$PUB_STATUS" = "200" ]; then
            echo "rito_flutter ${VERSION} is already published; no tag needed."
            exit 0
          fi
          if [ "$PUB_STATUS" != "404" ]; then
            echo "Unable to determine whether rito_flutter ${VERSION} is published (HTTP ${PUB_STATUS})."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists but rito_flutter ${VERSION} is not published. Rerun the tag's Flutter release workflow."
            exit 1
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${RELEASE_SHA}"
          echo "Created ${TAG} at ${RELEASE_SHA}; flutter-release will publish it through pub.dev OIDC."
