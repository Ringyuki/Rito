name: Pixel E2E

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  pixel-e2e:
    name: Reader E2E (pixel suites)
    runs-on: macos-26
    # Non-blocking observation: these suites assert canvas-pixel heuristics
    # calibrated against the vite dev server's rendering; the built preview
    # lays the fixture out with different metrics and the pixel scans
    # misread it even though the selection data assertions pass. Kept in
    # its own workflow so it never stretches the CI round the Release
    # workflow waits on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browser
        run: pnpm exec playwright install chromium
      - name: Build Reader Packages
        run: pnpm run build
      - name: Run Pixel E2E Suites
        run: pnpm --filter @ritojs/reader exec playwright test tests/e2e/reader-selection.e2e.test.ts tests/e2e/reader-selection-touch.e2e.test.ts tests/e2e/reader-production-pinned-font.e2e.test.ts
      - name: Upload Pixel E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reader-e2e-pixel-results
          path: |
            apps/reader/playwright-report/
            apps/reader/test-results/
          if-no-files-found: ignore
          retention-days: 7
