[package]
name = "rito-inline"
description = "Parley-backed inline formatting context implementing the rito-fragment provider contract."
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
parley = "0.11"
# Script property, for keying host line-metric samples the way a browser
# keys font fallback. Already in the graph through parley, so this adds no
# weight to the wasm binary.
icu_properties = { version = "2.1.2", features = ["compiled_data"], default-features = false }
rito-fragment = { path = "../rito-fragment" }
rito-style-contract = { path = "../rito-style-contract" }
