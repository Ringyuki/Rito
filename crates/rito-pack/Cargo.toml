[package]
name = "rito-pack"
description = "WASM boundary for packing publications into shards and checking that the reader can read them"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
js-sys = { version = "=0.3.97", default-features = false }
rito-core = { path = "../rito-core" }
wasm-bindgen = "=0.2.120"

[lints]
workspace = true
