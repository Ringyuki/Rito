[package]
name = "rito-core"
description = "Rust engine workspace for Rito EPUB parsing, layout, and render contracts"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-linebreak = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1.1"

[lints]
workspace = true
