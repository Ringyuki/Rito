[package]
name = "rito-core"
description = "Rust engine workspace for Rito EPUB parsing, layout, and render contracts"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[example]]
name = "chapter-fragment-probe"
path = "examples/chapter_fragment_probe.rs"

[[example]]
name = "fragment-pagination-probe"
path = "examples/fragment_pagination_probe.rs"

[[example]]
name = "reader-v1-demo-probe"
path = "examples/reader_v1_demo_probe.rs"

[[example]]
name = "bounded-pagination-probe"
path = "examples/bounded_pagination_probe.rs"
required-features = ["bench-internals"]

[[example]]
name = "stylo-production-probe"
path = "examples/stylo_production_probe.rs"
required-features = ["bench-internals"]

[[example]]
name = "reader-v1-turn-probe"
path = "examples/reader_v1_turn_probe.rs"

[[example]]
name = "reader-v1-stage-probe"
path = "examples/reader_v1_stage_probe.rs"
required-features = ["bench-internals"]

[features]
bench-internals = ["legacy-css-diagnostics"]
legacy-css-diagnostics = []

[[test]]
name = "rust_fixture_package"
path = "tests/rust_fixture_package.rs"
required-features = ["legacy-css-diagnostics"]

[dependencies]
rito-block = { path = "../rito-block" }
rito-fragment = { path = "../rito-fragment" }
rito-inline = { path = "../rito-inline" }
rito-source = { path = "../rito-source" }
rito-style-contract = { path = "../rito-style-contract" }
rito-stylo = { path = "../rito-stylo" }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-linebreak = "0.1"
unicode-bidi = "0.3"
unicode-segmentation = "1.12"
icu_segmenter = "2.2.0"
icu_locale_core = "2.2.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1.1"

[lints]
workspace = true
