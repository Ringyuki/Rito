[package]
name = "rito-core"
description = "Rust engine workspace for Rito EPUB parsing, layout, and render contracts"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[example]]
name = "chapter-fragment-probe"
path = "examples/chapter_fragment_probe.rs"

[[example]]
name = "anchor-roundtrip-probe"
path = "examples/anchor_roundtrip_probe.rs"

[[example]]
name = "memory-stage-probe"
path = "examples/memory_stage_probe.rs"

[[example]]
name = "shard-equivalence-probe"
path = "examples/shard_equivalence_probe.rs"

[[example]]
name = "layout-engine-bench"
path = "examples/layout_engine_bench.rs"

[[example]]
name = "paint-digest"
path = "examples/paint_digest.rs"

[[example]]
name = "relayout-bench"
path = "examples/relayout_bench.rs"

[[example]]
name = "resize-bench"
path = "examples/resize_bench.rs"

[dependencies]
rito-block = { path = "../rito-block" }
rito-fragment = { path = "../rito-fragment" }
rito-inline = { path = "../rito-inline" }
rito-source = { path = "../rito-source" }
rito-style-contract = { path = "../rito-style-contract" }
rito-stylo = { path = "../rito-stylo" }
roxmltree = "0.20"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
rustybuzz = "0.20"
ttf-parser = "0.25"
icu_segmenter = "2.2.0"
icu_locale_core = "2.2.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
miniz_oxide = "0.8"

[dev-dependencies]
flate2 = "1.1"

[lints]
workspace = true
