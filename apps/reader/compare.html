<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Rito ⇄ 浏览器 AB 对照</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.5 system-ui,
          sans-serif;
        background: #2a2a2e;
        color: #eee;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #1c1c1f;
        position: sticky;
        top: 0;
        z-index: 10;
        flex-wrap: wrap;
      }
      header .group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      button,
      select,
      input[type='number'] {
        font: inherit;
        background: #3a3a40;
        color: #eee;
        border: 1px solid #555;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #4a4a52;
      }
      input[type='number'] {
        width: 72px;
      }
      #status {
        color: #9a9;
        font-size: 13px;
      }
      main {
        display: flex;
        gap: 16px;
        padding: 16px;
        justify-content: center;
      }
      figure {
        margin: 0;
      }
      figcaption {
        padding: 4px 2px 8px;
        font-size: 13px;
        color: #bbb;
      }
      #left-canvas {
        background: #fff;
        width: 600px;
        height: 750px;
        display: block;
        box-shadow: 0 2px 12px #0008;
      }
      #right-view {
        background: #fff;
        width: 600px;
        height: 750px;
        padding: 50px 0;
        box-sizing: border-box;
        box-shadow: 0 2px 12px #0008;
      }
      #drop {
        border: 2px dashed #666;
        border-radius: 10px;
        padding: 60px;
        text-align: center;
        margin: 60px auto;
        max-width: 560px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="group">
        <input id="file" type="file" accept=".epub" />
      </div>
      <div class="group">
        <button id="prev">◀ 上一页</button>
        <input id="page" type="number" min="0" value="0" />
        <span id="total">/ 0</span>
        <button id="next">下一页 ▶</button>
      </div>
      <div class="group">
        <button id="right-prev">B ◀</button>
        <button id="right-next">B ▶</button>
        <label><input id="sync" type="checkbox" checked /> 翻页自动对齐</label>
      </div>
      <span id="status">选择一本 epub 开始</span>
    </header>
    <main hidden id="stage">
      <figure>
        <figcaption>A — rito 新引擎（fragment）</figcaption>
        <canvas id="left-canvas" width="600" height="750"></canvas>
      </figure>
      <figure>
        <figcaption>
          B — epub.js（浏览器排版・分页・同参数：视口 600×750 / 内容 500×650 / 16px）
        </figcaption>
        <div id="right-view"></div>
      </figure>
    </main>
    <div id="drop">
      拖入或选择一本 .epub<br /><small
        >左：rito 新引擎分页渲染　右：epub.js 浏览器排版分页（同参数）</small
      >
    </div>
    <script type="module" src="/src/compare/main.ts"></script>
  </body>
</html>
