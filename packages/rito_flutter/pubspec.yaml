name: rito_flutter
description: Platform-neutral Flutter painting and native bindings for Rito reader artifacts.
version: 0.3.0
repository: https://github.com/Ringyuki/Rito
issue_tracker: https://github.com/Ringyuki/Rito/issues
topics:
  - epub
  - reader
  - rendering
  - canvas
  - native-assets

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.7'

dependencies:
  code_assets: ^1.2.1
  crypto: ^3.0.7
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^2.0.2

dev_dependencies:
  characters: ^1.4.1
  flutter_test:
    sdk: flutter

flutter: {}
