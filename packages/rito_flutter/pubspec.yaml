name: rito_flutter
description: Platform-neutral Flutter painting and native bindings for Rito reader artifacts.
version: 0.9.0
repository: https://github.com/Ringyuki/Rito
issue_tracker: https://github.com/Ringyuki/Rito/issues
topics:
  - epub
  - reader
  - rendering
  - canvas
  - native-assets

environment:
  sdk: ^3.11.5
  flutter: '>=3.47.0'

dependencies:
  code_assets: ^1.2.1
  crypto: ^3.0.7
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  hooks: ^2.0.2
  vector_math: ^2.2.0

dev_dependencies:
  characters: ^1.4.1
  flutter_test:
    sdk: flutter

flutter:
  assets:
    # The paper turn's shaders, compiled by the build hook for the Flutter
    # building the app (a bundle is stamped with the impellerc that made it).
    - build/shaderbundles/paper.shaderbundle
